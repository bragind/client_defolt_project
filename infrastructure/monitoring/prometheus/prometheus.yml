# infrastructure/monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'credit-scoring-api'
    static_configs:
      - targets: ['host.docker.internal:8000']  # для локального запуска через docker-compose
        # В K8s заменить на service: 'api-service:8000'
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']