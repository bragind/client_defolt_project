# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and push
        run: |
          docker build -t your-repo/credit-scoring-api:latest -f deployment/docker/Dockerfile .
          docker push your-repo/credit-scoring-api:latest

  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Deploy to Kubernetes
        uses: kelseyhightower/awesome-kubernetes-actions@v1
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
          command: kubectl apply -f k8s/

      - name: Wait for deployment
        run: kubectl rollout status deployment/credit-scoring-api --timeout=5m