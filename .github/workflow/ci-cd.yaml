name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: registry.yandex.net
  IMAGE_NAME: credit-scoring/api
  K8S_NAMESPACE: credit-scoring

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run Bandit security linter
      uses: shundor/python-bandit-scan@v1.1.0
      with:
        path: src/
        output_format: 'json'
        output_file: 'bandit-report.json'
    
    - name: Check for secrets in code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
      
    - name: Detect secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --only-verified

  test:
    needs: security-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
    
    - name: Run model validation tests
      run: |
        python scripts/model_training/validate_onnx.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix={{branch}}-
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=raw,value=latest
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./infrastructure/docker/Dockerfile.api
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
    
    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-image-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Docker scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-image-results.sarif'

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.26.0'
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
    
    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 --decode > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml
    
    - name: Deploy to staging
      run: |
        kubectl apply -f infrastructure/kubernetes/overlays/staging/
        kubectl rollout status deployment/credit-scoring-api -n ${{ env.K8S_NAMESPACE }} --timeout=5m
    
    - name: Run integration tests
      run: |
        export API_URL=https://staging.api.credit-scoring.example.com
        python tests/integration/test_api_integration.py

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG_PROD }}" | base64 --decode > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml
    
    - name: Blue-Green deployment
      run: |
        # Deploy new version (blue)
        kubectl apply -f infrastructure/kubernetes/overlays/production/blue/
        
        # Wait for blue to be ready
        kubectl rollout status deployment/credit-scoring-api-blue -n ${{ env.K8S_NAMESPACE }} --timeout=5m
        
        # Switch traffic to blue using Istio
        kubectl apply -f infrastructure/kubernetes/istio/virtual-service-blue.yaml
        
        # Run smoke tests on blue
        export API_URL=https://api.credit-scoring.example.com
        python tests/integration/smoke_tests.py
        
        # If tests pass, update green deployment
        kubectl apply -f infrastructure/kubernetes/overlays/production/green/
    
    - name: Monitor deployment
      run: |
        # Monitor metrics for 5 minutes
        timeout 300 bash -c '
          while true; do
            ERROR_RATE=$(kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/${{ env.K8S_NAMESPACE }}/pods/*/http_requests_error_rate" | jq ".items[0].value" || echo "0")
            if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
              echo "High error rate detected: $ERROR_RATE"
              # Rollback to previous version
              kubectl apply -f infrastructure/kubernetes/overlays/production/rollback/
              exit 1
            fi
            sleep 10
          done
        '

  monitoring:
    needs: deploy-production
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check deployment status
      run: |
        if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
          echo "Deployment successful"
          # Send success notification
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ Production deployment completed successfully!"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
        else
          echo "Deployment failed"
          # Send failure notification
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ Production deployment failed! Check logs for details."}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
          exit 1
        fi
    
    - name: Run monitoring tests
      run: |
        # Check model performance metrics
        python scripts/monitoring/check_performance.py
        
        # Check data drift
        python scripts/monitoring/check_drift.py