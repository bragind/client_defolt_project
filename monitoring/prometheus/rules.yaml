# monitoring/prometheus/rules.yml
groups:
- name: credit-scoring-alerts
  rules:
  - alert: HighLatency
    expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Высокая задержка API (>1s)"
      description: "Задержка API превысила 1 секунду в течение 5 минут."

  - alert: ModelDriftDetected
    expr: avg(model_drift_score) > 0.2
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "Обнаружен дрейф данных"
      description: "Оценка дрейфа данных превысила порог 0.2."